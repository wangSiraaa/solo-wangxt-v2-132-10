[package]
name = "range-cache-proxy"
version = "0.1.0"
edition = "2021"

[features]
# Local test upstream server, compiled into the test-support binary.
test-support = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
url = "2"
percent-encoding = "2"
anyhow = "1"
thiserror = "2"
async-stream = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
sha2 = "0.10"
futures-util = "0.3"
